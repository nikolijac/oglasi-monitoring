name: Oglasi CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:

      - name: Preuzimanje projekta
        uses: actions/checkout@v4

      - name: Podesavanje Python-a
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalacija zavisnosti
        run: pip install -r requirements.txt

      - name: Provera aplikacije
        run: python -m py_compile app.py

      - name: Pokretanje testova
        run: |
          set -o pipefail
          python -m pytest -q | tee rezultat_testova.txt
          echo "TEST_REZULTAT=$(tail -n 1 rezultat_testova.txt)" >> $GITHUB_ENV

      - name: Docker deployment
        run: |
          docker stop oglasi-container || true
          docker rm oglasi-container || true
          docker build -t oglasi-app .
          docker run -d --name oglasi-container -p 5000:5000 oglasi-app

      - name: Provera deploymenta
        run: |
          sleep 3

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000)

          echo "HTTP_STATUS=$STATUS" >> $GITHUB_ENV

          if [ "$STATUS" != "200" ]; then
            echo "Deployment nije uspešan. HTTP status: $STATUS"
            exit 1
          fi

          echo "Deployment uspešan. HTTP status: $STATUS"

      - name: Prikupljanje sistemskih metrika
        if: always()
        run: |
          python monitoring.py >> $GITHUB_ENV

      - name: Priprema podataka
        if: always()
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Discord - uspesan pipeline
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🟢 Oglasi CI/CD - Deployment uspešan",
              "description": "Aplikacija je uspešno testirana i deployovana na Ubuntu VM.",
              "color": 3066993,
              "fields": [
                {
                  "name": "👤 Autor",
                  "value": "${{ github.actor }}",
                  "inline": true
                },
                {
                  "name": "📌 Commit",
                  "value": "`${{ env.SHORT_SHA }}`",
                  "inline": true
                },
                {
                  "name": "📊 Status",
                  "value": "SUCCESS",
                  "inline": true
                },
                {
                  "name": "🧪 Testovi",
                  "value": "${{ env.TEST_REZULTAT }}",
                  "inline": true
                },
                {
                  "name": "🐳 Docker",
                  "value": "oglasi-container",
                  "inline": true
                },
                {
                  "name": "🌐 HTTP",
                  "value": "${{ env.HTTP_STATUS }} OK",
                  "inline": true
                },
                {
                  "name": "💻 CPU",
                  "value": "${{ env.CPU }}",
                  "inline": true
                },
                {
                  "name": "🧠 RAM",
                  "value": "${{ env.RAM }}",
                  "inline": true
                },
                {
                  "name": "💾 Disk",
                  "value": "${{ env.DISK }}",
                  "inline": true
                },
                {
                  "name": "🔗 Logovi",
                  "value": "[Pogledaj GitHub Actions logove](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Oglasi Monitoring System"
              }
            }]
          }' \
          "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Discord - neuspesan pipeline
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🔴 Oglasi CI/CD - Deployment neuspešan",
              "description": "Pipeline nije uspešno završen. Potrebno je proveriti GitHub Actions logove.",
              "color": 15158332,
              "fields": [
                {
                  "name": "👤 Autor",
                  "value": "${{ github.actor }}",
                  "inline": true
                },
                {
                  "name": "📌 Commit",
                  "value": "`${{ env.SHORT_SHA }}`",
                  "inline": true
                },
                {
                  "name": "📊 Status",
                  "value": "FAILURE",
                  "inline": true
                },
                {
                  "name": "🧪 Testovi",
                  "value": "${{ env.TEST_REZULTAT || 'Testovi nisu završeni' }}",
                  "inline": true
                },
                {
                  "name": "🌐 HTTP",
                  "value": "${{ env.HTTP_STATUS || 'Nije dostupan' }}",
                  "inline": true
                },
                {
                  "name": "💻 CPU",
                  "value": "${{ env.CPU || 'Nije dostupno' }}",
                  "inline": true
                },
                {
                  "name": "🧠 RAM",
                  "value": "${{ env.RAM || 'Nije dostupno' }}",
                  "inline": true
                },
                {
                  "name": "💾 Disk",
                  "value": "${{ env.DISK || 'Nije dostupno' }}",
                  "inline": true
                },
                {
                  "name": "🔗 Logovi",
                  "value": "[Pogledaj GitHub Actions logove](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Oglasi Monitoring System"
              }
            }]
          }' \
          "${{ secrets.DISCORD_WEBHOOK }}"