name: Oglasi CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:

      - name: Preuzimanje projekta
        uses: actions/checkout@v4

      - name: Podesavanje Python-a
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalacija zavisnosti
        run: pip install -r requirements.txt

      - name: Provera aplikacije
        run: python -m py_compile app.py

      - name: Pokretanje testova
        run: |
          python -m pytest -q | tee rezultat_testova.txt
          echo "TEST_REZULTAT=$(cat rezultat_testova.txt | tail -n 1)" >> $GITHUB_ENV

      - name: Prikupljanje sistemskih metrika
        if: always()
        run: |
          python monitoring.py >> $GITHUB_ENV

      - name: Priprema podataka
        if: always()
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Discord - uspesan pipeline
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🟢 Oglasi CI/CD - Deployment uspešan",
              "description": "Aplikacija je uspešno testirana i pipeline je završen.",
              "color": 3066993,
              "fields": [
                {
                  "name": "👤 Autor",
                  "value": "${{ github.actor }}",
                  "inline": true
                },
                {
                  "name": "📌 Commit",
                  "value": "`${{ env.SHORT_SHA }}`",
                  "inline": true
                },
                {
                  "name": "📊 Status",
                  "value": "SUCCESS",
                  "inline": true
                },
                {
                  "name": "🧪 Testovi",
                  "value": "${{ env.TEST_REZULTAT }}",
                  "inline": true
                },
                {
                  "name": "💻 CPU",
                  "value": "${{ env.CPU }}%",
                  "inline": true
                },
                {
                  "name": "🧠 RAM",
                  "value": "${{ env.RAM }}%",
                  "inline": true
                },
                {
                  "name": "💾 Disk",
                  "value": "${{ env.DISK }}%",
                  "inline": true
                },
                {
                  "name": "🔗 Logovi",
                  "value": "[Pogledaj GitHub Actions logove](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Oglasi Monitoring System"
              }
            }]
          }' \
          "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Discord - neuspesan pipeline
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🔴 Oglasi CI/CD - Deployment neuspešan",
              "description": "Pipeline nije uspešno završen. Potrebno je proveriti logove.",
              "color": 15158332,
              "fields": [
                {
                  "name": "👤 Autor",
                  "value": "${{ github.actor }}",
                  "inline": true
                },
                {
                  "name": "📌 Commit",
                  "value": "`${{ env.SHORT_SHA }}`",
                  "inline": true
                },
                {
                  "name": "📊 Status",
                  "value": "FAILURE",
                  "inline": true
                },
                {
                  "name": "🧪 Testovi",
                  "value": "Pipeline je pao tokom izvršavanja testova",
                  "inline": true
                },
                {
                  "name": "💻 CPU",
                  "value": "${{ env.CPU }}%",
                  "inline": true
                },
                {
                  "name": "🧠 RAM",
                  "value": "${{ env.RAM }}%",
                  "inline": true
                },
                {
                  "name": "💾 Disk",
                  "value": "${{ env.DISK }}%",
                  "inline": true
                },
                {
                  "name": "🔗 Logovi",
                  "value": "[Pogledaj GitHub Actions logove](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Oglasi Monitoring System"
              }
            }]
          }' \
          "${{ secrets.DISCORD_WEBHOOK }}"